<!DOCTYPE HTML>
<html>
    <head>
        <title>
            Hallucinating QWOP
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <div style="text-align: center; touch-action: manipulation">
            <a href="../">Back to Home</a>
            <h2>Hallucinating QWOP</h2>
            <canvas id="canvas" width="96" height="96" style="width: 288px; height: 288px; border: solid black; border-width: 1px;"></canvas><br/>
            <b>Controls</b><br/>
            Q, W, O, P<br/>
            R to restart
            <p id="stats">Loading...</p>
            <div>
                If no keyboard is available:<br/>
                <button id="q" style="user-select: none; padding: 20px;">Q</button>
                <button id="w" style="user-select: none; padding: 20px;">W</button>
                <button id="o" style="user-select: none; padding: 20px;">O</button>
                <button id="p" style="user-select: none; padding: 20px;">P</button>
                <button id="r" style="user-select: none; padding: 20px;">R</button>
            </div>
            <br/>
            <div>
                <button id="play-pause">pause</button>
            </div>
            <br/>
            <div id="sliders">
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
