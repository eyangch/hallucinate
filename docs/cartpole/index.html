<!DOCTYPE HTML>
<html>
    <head>
        <title>
            Hallucinating Cartpole
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <div style="text-align: center; touch-action: manipulation">
            <a href="../">Back to Home</a>
            <h2>Hallucinating Cartpole</h2>
            <canvas id="canvas" width="192" height="192" style="width: 192px; height: 192px; border: solid black; border-width: 1px;"></canvas><br/>
            <b>Controls</b><br/>
            Left arrow/Right arrow keys<br/>
            R to restart
            <p id="stats">Loading...</p>
            <div style="-webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;">
                If no keyboard is available:<br/><br/>
                <button id="left" style="padding: 20px; appearance: none; -webkit-appearance: none;">&lt;</button>
                <button id="right" style="padding: 20px; appearance: none; -webkit-appearance: none;">&gt;</button>
                <button id="r" style="padding: 20px; appearance: none; -webkit-appearance: none;">R</button>
                <br/><br/>
                <button id="play-pause">pause</button>
                <br/><br/>
            </div>
            <div id="sliders">
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
