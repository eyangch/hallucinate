<!DOCTYPE HTML>
<html>
    <head>
        <title>
            Hallucinating Cartpole
        </title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
    </head>
    <body>
        <div style="text-align: center; touch-action: manipulation">
            <a href="../">Back to Home</a>
            <h2>Hallucinating Cartpole</h2>
            <canvas id="canvas" width="192" height="192" style="width: 288px; height: 288px; border: solid black; border-width: 1px;"></canvas><br/>
            <b>Controls</b><br/>
            Left arrow/Right arrow keys<br/>
            R to restart
            <p id="stats">Loading...</p>
            <div>
                If no keyboard is available:<br/>
                <button id="left" style="user-select: none; padding: 20px;">&lt;</button>
                <button id="right" style="user-select: none; padding: 20px;">&gt;</button>
            </div>
            <br/>
            <div>
                <button id="play-pause">pause</button>
            </div>
            <br/>
            <div id="sliders">
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
        <script src="script.js"></script>
    </body>
</html>
